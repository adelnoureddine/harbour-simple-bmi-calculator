<?xml version="1.0" encoding="UTF-8"?>
<!--
  Simple BMI Calculator, launcher icon. Drawn on a 172 px grid, the largest size the app
  ships; the PNGs in icons/ are this file rendered at 86, 108, 128 and 172 px.
  A ring in the BMI band colours (underweight, normal, overweight, obesity) with the
  letters B, M and I, around a stethoscope.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="172" height="172" viewBox="0 0 172 172">
  <defs>
    <clipPath id="ring">
      <circle cx="86" cy="86" r="73"/>
    </clipPath>
  </defs>
  <circle cx="86" cy="86" r="84" fill="#e4e4e4"/>
  <circle cx="86" cy="86" r="84" fill="none" stroke="#bdbdbd" stroke-width="2"/>
  <!-- The ring: four quarters, left to bottom, in the band colours. -->
  <g stroke="#ffffff" stroke-width="2" clip-path="url(#ring)">
    <path d="M86 86 L14.9 14.9 A100.5 100.5 0 0 0 14.9 157.1 Z" fill="#3498db"/>
    <path d="M86 86 L14.9 14.9 A100.5 100.5 0 0 1 157.1 14.9 Z" fill="#2ecc71"/>
    <path d="M86 86 L157.1 14.9 A100.5 100.5 0 0 1 157.1 157.1 Z" fill="#e67e22"/>
    <path d="M86 86 L157.1 157.1 A100.5 100.5 0 0 1 14.9 157.1 Z" fill="#e74c3c"/>
  </g>
  <circle cx="86" cy="86" r="84" fill="none" stroke="#bdbdbd" stroke-width="2"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="30"
     fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <text x="31" y="87">B</text>
    <text x="86" y="32">M</text>
    <text x="141" y="87">I</text>
  </g>
  <!-- The stethoscope, on a blue disc. -->
  <circle cx="86" cy="86" r="35" fill="#1c9fd8" stroke="#ffffff" stroke-width="4"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M73 64 V75 A13 13 0 0 0 99 75 V64"/>
    <path d="M86 88 V96 A9 9 0 0 0 104 96 V91"/>
    <circle cx="104" cy="85" r="6"/>
  </g>
  <g fill="#ffffff">
    <circle cx="73" cy="62" r="3"/>
    <circle cx="99" cy="62" r="3"/>
  </g>
</svg>
